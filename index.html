<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마음 톡톡 · 실시간 이모티콘 보내기</title>
<style>
:root{font-family:system-ui,-apple-system,"맑은 고딕",sans-serif;color:#302c42;background:#fff9ef;font-size:16px;line-height:1.6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#ffe7b5,transparent 52%),#fff9ef;min-height:100vh}button,input{font:inherit}button{cursor:pointer;min-height:48px;border:0;border-radius:18px;font-weight:750;color:inherit;padding:12px 22px;touch-action:manipulation}button:disabled{cursor:wait;opacity:.55}button:focus-visible,input:focus-visible{outline:3px solid #6740c8;outline-offset:4px}[hidden]{display:none!important}.shell{width:min(1080px,100%);margin:auto;padding:28px 24px 44px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-size:22px;font-weight:850;letter-spacing:-1px}.brand span{color:#7650bd}.status{font-size:16px;padding:8px 14px;background:#fff;border:1px solid #e7ded0;border-radius:24px;max-width:100%;overflow-wrap:anywhere}.status::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#b77827;margin-right:9px}.status[data-ok="true"]::before{background:#25875b}.welcome{text-align:center;padding:60px 0 22px}.eyebrow{font-weight:700;color:#725294;margin:0 0 8px}h1{font-size:clamp(30px,5vw,48px);line-height:1.25;letter-spacing:-1.6px;margin:0 0 18px}p{margin:8px 0;color:#666071}.lead{font-size:18px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:760px;margin:34px auto}.role{padding:30px 24px;text-align:left;border:1px solid #e4d8f4;background:#eee4ff;box-shadow:0 8px 0 #dfd1ef;transition:transform .18s}.role:hover{transform:translateY(-3px)}.role.student{background:#ffe498;border-color:#e9ce7e;box-shadow:0 8px 0 #f2d585}.role-icon{display:block;font-size:48px;margin-bottom:18px}.role strong{display:block;font-size:27px}.role small{font-size:16px;display:block;font-weight:450;margin-top:5px}.login{max-width:520px;margin:30px auto 0;padding:26px;text-align:left;background:white;border:1px solid #e6ddd2;border-radius:24px}.login h2{margin:0 0 14px;font-size:22px}.login label{display:block;margin-bottom:8px;font-weight:700}.input-row{display:flex;gap:10px;flex-wrap:wrap}input{min-width:0;width:100%;flex:1 1 180px;min-height:52px;border:1px solid #bcb2c7;border-radius:12px;padding:10px 14px}.primary{background:#7045b5;color:white}.error{color:#af263c;min-height:26px;margin-top:8px}.back{background:#fff;border:1px solid #d8cfdf}.view-head{display:flex;align-items:start;justify-content:space-between;gap:20px;margin:44px 0 28px}.view-head h1{font-size:clamp(28px,4vw,42px)}.send-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.reaction{min-height:166px;transition:transform .18s;border:1px solid #dfd5bd;font-size:22px;background:#ffe49b;box-shadow:0 6px 0 #ebca75}.reaction:nth-child(2){background:#ffdce5;border-color:#f1bfd0;box-shadow:0 6px 0 #edbfcf}.reaction:nth-child(3){background:#d9eee3;border-color:#b7d9c5;box-shadow:0 6px 0 #b9d9c6}.reaction span{font-size:50px;display:block;margin-bottom:8px}.reaction.pop{animation:pop .25s ease}.send-status{min-height:32px;margin:18px 0}.board{margin-top:20px;background:#fff;border:1px solid #e8dfd3;border-radius:28px;padding:28px;box-shadow:0 12px 36px #58391d07}.board-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.board h2{margin:0;font-size:23px}.total{font-size:22px;font-weight:750;color:#714bb1}.teacher .total{font-size:clamp(24px,4vw,36px)}.stage{position:relative;background:#fcf9ff;border:1px dashed #dfd3ee;border-radius:20px;min-height:170px;margin:24px 0;overflow:hidden;display:grid;place-items:center;text-align:center;padding:24px}.teacher .stage{min-height:250px}.stage p{max-width:100%;color:#796b8d}.floating{position:absolute;font-size:48px;bottom:0;animation:float 3s ease-out forwards;pointer-events:none}.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.count{padding:18px;background:#fff8e7;border-radius:18px;text-align:center;min-width:0;overflow-wrap:anywhere}.count:nth-child(2){background:#fff0f4}.count:nth-child(3){background:#eff8f3}.count strong{display:block;font-size:clamp(28px,4vw,44px);font-variant-numeric:tabular-nums;line-height:1.3;margin-top:8px}.recent{display:flex;gap:10px;flex-wrap:wrap;min-height:40px;margin-top:14px}.chip{background:#f5f1f9;padding:4px 12px;border-radius:12px;font-size:24px}footer{text-align:center;font-size:16px;color:#807486;margin-top:32px}.note{font-size:16px}.teacher .board{margin-top:0}@keyframes pop{50%{transform:scale(1.045)}}@keyframes float{0%{opacity:0;transform:translateY(15px) rotate(-12deg)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-190px) rotate(12deg)}}@media(max-width:600px){.shell{padding:20px 16px 32px}.welcome{padding-top:36px}.roles{grid-template-columns:1fr;gap:20px;margin-top:24px}.role{padding:20px}.role-icon{float:left;margin:0 20px 0 0;font-size:40px}.role strong{font-size:24px}.view-head{margin-top:28px;flex-direction:column;gap:12px}.send-grid{gap:10px}.reaction{font-size:16px;padding:16px 5px;min-height:130px;border-radius:16px}.reaction span{font-size:38px}.board{padding:18px}.counts{gap:8px}.count{padding:14px 5px}.count strong{font-size:28px}.count-label{display:block}.login{padding:20px}.login .primary{flex:1 1 100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.floating{display:none}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand">💬 마음 <span>톡톡</span></div><div id="connection" class="status" role="status">연결 확인 중…</div></header>
<main>
<section id="home" class="welcome">
<p class="eyebrow">함께하는 수업, 마음을 나누는 순간</p><h1>지금 마음을<br>이모티콘으로 톡!</h1><p class="lead">나의 역할을 선택하고 우리 반과 반응을 나눠요.</p>
<div class="roles"><button id="teacherChoice" class="role"><span class="role-icon" aria-hidden="true">🧑‍🏫</span><strong>강사 모드</strong><small>우리 반의 반응을 한눈에 봐요 →</small></button><button id="studentChoice" class="role student"><span class="role-icon" aria-hidden="true">🙋</span><strong>학생 모드</strong><small>내 마음을 이모티콘으로 보내요 →</small></button></div>
<form id="login" class="login" hidden><h2>강사 모드로 들어가기</h2><label for="password">비밀번호</label><div class="input-row"><input id="password" type="password" inputmode="numeric" autocomplete="off" aria-describedby="passwordError" placeholder="비밀번호를 입력해 주세요"><button class="primary" type="submit">입장하기</button></div><p id="passwordError" class="error" role="alert"></p><button type="button" class="back" id="loginBack">처음으로</button></form>
</section>
<section id="classroom" hidden>
<div class="view-head"><div><p id="modeLabel" class="eyebrow"></p><h1 id="viewTitle" tabindex="-1"></h1><p id="viewHint"></p></div><button id="homeButton" class="back">← 처음으로</button></div>
<div id="studentControls"><div class="send-grid"><button class="reaction" data-kind="like" disabled><span aria-hidden="true">👍</span>좋아요</button><button class="reaction" data-kind="heart" disabled><span aria-hidden="true">❤️</span>공감해요</button><button class="reaction" data-kind="cheer" disabled><span aria-hidden="true">👏</span>응원해요</button></div><p id="sendStatus" class="send-status" role="status">연결되면 반응을 보낼 수 있어요.</p></div>
<section class="board" aria-label="우리 반의 실시간 반응"><div class="board-head"><h2>우리 반의 실시간 반응</h2><div class="total">지금까지 반응 <span id="total">—</span>회</div></div><p id="dataStatus" role="status">반응을 불러오는 중이에요.</p><div id="stage" class="stage" aria-hidden="true"><p id="stageHint">친구들의 마음이 이곳에 모여요 ✨</p></div><div class="counts"><div class="count">👍 <span class="count-label">좋아요</span><strong id="like">—</strong></div><div class="count">❤️ <span class="count-label">공감해요</span><strong id="heart">—</strong></div><div class="count">👏 <span class="count-label">응원해요</span><strong id="cheer">—</strong></div></div><p style="margin-top:20px">최근 도착한 반응</p><div id="recent" class="recent" aria-label="최근 반응"></div></section>
</section>
</main><footer>작은 반응 하나가 수업에 힘이 돼요.</footer>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
'use strict';
// 제공된 설정값을 그대로 보관합니다. 마크다운 링크는 아래에서 실제 URL로 풀어 사용합니다.
const firebaseConfig = {
apiKey: "AIzaSyDBP37x4QVniIRFDgBkpjJSdL4dU3CLUF4",
authDomain: "test-e1c46.firebaseapp.com",
databaseURL: "[https://test-e1c46-default-rtdb.asia-southeast1.firebasedatabase.app](https://test-e1c46-default-rtdb.asia-southeast1.firebasedatabase.app)",
projectId: "test-e1c46",
storageBucket: "test-e1c46.firebasestorage.app",
messagingSenderId: "405280615476",
appId: "1:405280615476:web:3bd008604c1407f7cdae61"
};
const $=id=>document.getElementById(id);
const kinds={like:{emoji:'👍',label:'좋아요'},heart:{emoji:'❤️',label:'공감해요'},cheer:{emoji:'👏',label:'응원해요'}};
let mode='home',writer,reader,online=false,writerOnline=false,ready=false,readError=false,pending=0,failed=0,confirmed=0;
const buttons=[...document.querySelectorAll('[data-kind]')];
function goHome(){mode='home';$('home').hidden=false;$('classroom').hidden=true;$('login').hidden=true;$('password').value='';$('passwordError').textContent='';$('password').removeAttribute('aria-invalid');$('teacherChoice').focus();}
function enter(next){mode=next;$('home').hidden=true;$('classroom').hidden=false;$('classroom').className=next;$('studentControls').hidden=next!=='student';$('login').hidden=true;$('password').value='';$('modeLabel').textContent=next==='teacher'?'강사 모드':'학생 모드';$('viewTitle').textContent=next==='teacher'?'우리 반 실시간 반응':'지금 내 반응을 보내요!';$('viewHint').textContent=next==='teacher'?'함께 보내는 마음을 실시간으로 확인해요.':'마음에 드는 반응을 눌러요. 여러 번 보내도 좋아요!';$('viewTitle').focus();}
$('teacherChoice').onclick=()=>{$('login').hidden=false;$('password').value='';$('passwordError').textContent='';$('password').focus();};
$('studentChoice').onclick=()=>enter('student');$('homeButton').onclick=goHome;$('loginBack').onclick=goHome;
$('login').onsubmit=e=>{e.preventDefault();if($('password').value==='1004'){enter('teacher');}else{$('passwordError').textContent='비밀번호가 맞지 않아요. 다시 입력해 주세요.';$('password').setAttribute('aria-invalid','true');$('password').focus();$('password').select();}};
function connection(){const ok=online&&writerOnline&&!readError&&ready;$('connection').dataset.ok=String(ok);$('connection').textContent=readError?'데이터 읽기 실패 · 접근 설정 확인':ok?'실시간 연결됨':online&&writerOnline?'반응 불러오는 중…':'연결 끊김 · 다시 연결하는 중…';buttons.forEach(b=>b.disabled=!ok);if(!online&&ready)$('dataStatus').textContent='연결이 끊겨 마지막으로 확인한 횟수를 표시해요.';}
function transmission(){let parts=[];if(pending)parts.push(`${pending}개 전송 확인 중 · 연결이 끊기면 복구 후 계속 전송해요. 창을 닫지 마세요.`);if(confirmed)parts.push(`서버가 확인한 내 반응 ${confirmed}회`);if(failed)parts.push(`전송 실패 ${failed}회 · 연결과 데이터베이스 쓰기 권한을 확인한 뒤 다시 눌러 주세요.`);$('sendStatus').textContent=parts.join(' / ')||'반응을 눌러 우리 반에 마음을 보내요.';$('sendStatus').style.color=failed?'#af263c':'';}
function animate(kind){if(mode==='home'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const el=document.createElement('span');el.className='floating';el.textContent=kinds[kind].emoji;el.style.left=(5+Math.random()*75)+'%';$('stage').append(el);setTimeout(()=>el.remove(),3100);}
buttons.forEach(button=>button.onclick=async()=>{const kind=button.dataset.kind;if(!online||!writerOnline||!ready||readError)return;button.classList.remove('pop');void button.offsetWidth;button.classList.add('pop');pending++;transmission();const key=writer.child('events').push().key;const changes={};changes['counts/'+kind]=firebase.database.ServerValue.increment(1);changes['events/'+key]={kind,at:firebase.database.ServerValue.TIMESTAMP};try{await writer.update(changes);confirmed++;}catch(error){failed++;}finally{pending--;transmission();}});
try{
 if(!window.firebase)throw new Error('SDK');
 const raw=firebaseConfig.databaseURL||'';const markdown=raw.match(/^\[[^\]]+\]\((https:\/\/[^)]+)\)$/);const url=markdown?markdown[1]:raw;
 if(!url||!/^https:\/\/[a-z0-9.-]+\/?$/i.test(url))throw new Error('CONFIG');
 const config={...firebaseConfig,databaseURL:url};
 // 별도 읽기 연결: 쓰기 SDK의 로컬 선반영을 성공한 반응으로 보여주지 않습니다.
 const writeApp=firebase.initializeApp(config,'reaction-writer');const readApp=firebase.initializeApp(config,'reaction-reader');
 writer=writeApp.database().ref('practice/reactions');reader=readApp.database().ref('practice/reactions');
 writeApp.database().ref('.info/connected').on('value',s=>{writerOnline=s.val()===true;connection();});
 readApp.database().ref('.info/connected').on('value',s=>{online=s.val()===true;connection();});
 const onError=()=>{readError=true;$('dataStatus').textContent='반응을 읽지 못했어요. Firebase 콘솔에서 데이터베이스 읽기 권한을 확인하고 새로고침해 주세요.';connection();};
 reader.child('counts').on('value',s=>{const counts=s.val()||{};let total=0;for(const kind of Object.keys(kinds)){const n=Number.isSafeInteger(counts[kind])&&counts[kind]>=0?counts[kind]:0;$(kind).textContent=n.toLocaleString('ko-KR');total+=n;}$('total').textContent=total.toLocaleString('ko-KR');ready=true;$('dataStatus').textContent='서버에서 확인한 반응이에요. 모두의 화면에 함께 반영돼요.';connection();},onError);
 let initial=true,previous=new Set();
 reader.child('events').limitToLast(80).on('value',s=>{const rows=[];s.forEach(child=>{const value=child.val();if(value&&Object.hasOwn(kinds,value.kind))rows.push({id:child.key,kind:value.kind});});if(!initial)rows.filter(row=>!previous.has(row.id)).forEach(row=>animate(row.kind));initial=false;previous=new Set(rows.map(row=>row.id));$('recent').replaceChildren(...rows.slice(-12).reverse().map(row=>{const el=document.createElement('span');el.className='chip';el.textContent=kinds[row.kind].emoji;el.setAttribute('aria-label',kinds[row.kind].label);return el;}));$('stageHint').textContent=rows.length?'우리 반의 마음이 도착하고 있어요 ✨':'첫 반응을 기다리고 있어요 ✨';},onError);
 setTimeout(()=>{if(!ready&&!readError)$('dataStatus').textContent='연결이 지연되고 있어요. 인터넷 연결과 Firebase 설정을 확인해 주세요.';},12000);
}catch(error){$('connection').textContent=error.message==='CONFIG'?'설정 오류 · 데이터베이스 주소 확인':'연결 준비 실패 · 인터넷 연결 후 새로고침';$('dataStatus').textContent='반응을 불러오지 못했어요. 인터넷 연결과 Firebase 설정을 확인해 주세요.';}
</script>
</body>
</html>
